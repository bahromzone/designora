# Dependabot — bog'liqliklarni yangilash siyosati
#
# QOIDA: Dependabot o'zboshimchalik bilan PR ochmaydi.
# open-pull-requests-limit: 0 rejadagi (version-update) PR'larni o'chiradi.
# Xavfsizlik (security) update'lari bu limitdan qat'i nazar keladi — ular kerak.
#
# Yangilanishlarni ko'rmoqchi bo'lsang:
#   Insights > Dependency graph > Dependabot > "Check for updates",
#   yoki kerakli ekosistemada limitni vaqtincha 5 ga ko'tar.
#
# Major (breaking) versiyalar hamma joyda ignore qilingan: ular faqat qo'lda,
# ongli ravishda va alohida PR bilan kiritiladi.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  # ── Backend (pip) ──
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      backend-patch-minor:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  # ── Frontend (npm) ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-patch-minor:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
