# Dependabot — bog'liqliklarni avtomatik yangilash
# Major versiyalar alohida PR bo'lib, har biri mustaqil CI'dan o'tadi.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  # ── Backend (pip) ──
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-patch-minor:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  # ── Frontend (npm) ──
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-patch-minor:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
