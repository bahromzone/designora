name: Format backend

on:
  push:
    branches:
      - fix/ci-frontend-install-lint
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format backend Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend tooling
        run: pip install -r requirements-dev.txt

      - name: Apply Black formatting
        run: black .

      - name: Fix Ruff imports and safe autofixes
        run: ruff check . --fix

      - name: Re-apply Black formatting
        run: black .

      - name: Commit formatted backend
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "Backend is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply Black and Ruff formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
