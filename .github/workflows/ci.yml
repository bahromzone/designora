name: CI
run-name: CI (${{ github.event_name }}) - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migration + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Test migrations apply cleanly
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
        run: |
          cd backend
          python manage.py test

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check formatting with Prettier
        run: |
          cd frontend
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json,md}"

      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run unit & integration tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: designora-backend:ci-test

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: designora-frontend:ci-test
