name: CI
run-name: CI (${{ github.event_name }})

# MUHIM: bu yerda `pull_request.branches: [main]` filtri BO'LMASLIGI kerak.
# Filtr bo'lganda main'ga qaratilmagan PR'larda CI umuman ishga tushmaydi va
# PR yolg'ondan "Ready to merge" ko'rinadi. e2e.yml da bu qoida allaqachon
# amal qiladi, CI ham unga moslashtirildi.
#
# workflow_dispatch majburiy: GitHub incidenti paytida push va pull_request
# eventlari yo'qoladi va GitHub ularni qayta o'ynatmaydi. Qo'lda ishga
# tushirish imkoni bo'lmasa, PR checksiz qoladi va ko'r-ko'rona merge
# qilinadi.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + migration + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: designora
          POSTGRES_PASSWORD: designora
          POSTGRES_DB: designora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U designora -d designora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret
      SESSION_SECRET_KEY: ci-session
      JWT_SECRET_KEY: ci-jwt
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-pass
      MAIL_FROM: ci@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: smtp.example.com
      RECAPTCHA_SECRET_KEY: ci-recaptcha
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: designora
      PGPASSWORD: designora
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: bash scripts/ci_annotate.sh "Dependency install" pip install -r requirements-dev.txt
      - name: Ruff check
        run: bash scripts/ci_annotate.sh "Ruff" ruff check .
      - name: Black check
        run: bash scripts/ci_annotate.sh "Black" black --check .
      - name: Prepare and apply migrations against PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://designora:designora@localhost:5432/designora"
        run: |
          bash scripts/ci_annotate.sh "Migration" bash -c \
            "python -m scripts.prepare_migrations && alembic upgrade heads"
      - name: Create isolated test database
        id: testdb
        run: |
          bash scripts/ci_annotate.sh "Test database setup" bash -c \
            "dropdb --if-exists designora_test && createdb designora_test"
      - name: Pytest (SQLite - fast feedback)
        if: ${{ !cancelled() && steps.testdb.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: bash scripts/ci_annotate.sh "Pytest (SQLite)" pytest --tb=short
      - name: Pytest (PostgreSQL - production dialect)
        if: ${{ !cancelled() && steps.testdb.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: "postgresql+psycopg2://designora:designora@localhost:5432/designora_test"
        run: bash scripts/ci_annotate.sh "Pytest (PostgreSQL)" pytest --tb=short
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - run: npm run lint
      - name: Check formatting
        id: format
        run: npm run format:check
      - name: Report Prettier offenders
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: |
          set +e
          offenders=$(npx prettier --list-different "src/**/*.{js,jsx,css}")
          status=$?
          printf '%s\n' "$offenders"
          while IFS= read -r file; do
            [ -z "$file" ] || echo "::error file=$file::Prettier formatting differs"
          done <<< "$offenders"
          exit "$status"
      - run: npm run test:run
      - run: npm run coverage
      - run: npm run build
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Docker Hub'ga to'g'ridan-to'g'ri murojaat runner'larda i/o timeout
      # berib turadi. Mirror sozlanadi va base imagelar oldindan tortiladi,
      # shunda build lokal kesh ustida ishlaydi.
      - name: Configure registry mirror and warm base images
        run: |
          bash scripts/ci_docker_registry.sh \
            python:3.12-slim \
            node:22-alpine \
            nginx:1.27-alpine
      - name: Build backend image
        run: bash scripts/docker_build_retry.sh designora-backend ./backend
      - name: Build frontend image
        run: bash scripts/docker_build_retry.sh designora-frontend ./frontend
