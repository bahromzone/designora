name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    name: Backend (lint + migration + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: designora
          POSTGRES_PASSWORD: designora
          POSTGRES_DB: designora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U designora -d designora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # Barcha qadamlar uchun umumiy test sirlari (haqiqiy emas).
      ENVIRONMENT: development
      SECRET_KEY: ci-secret
      SESSION_SECRET_KEY: ci-session
      JWT_SECRET_KEY: ci-jwt
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-pass
      MAIL_FROM: ci@example.com
      MAIL_PORT: "587"
      MAIL_SERVER: smtp.example.com
      RECAPTCHA_SECRET_KEY: ci-recaptcha
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: designora
      PGPASSWORD: designora
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          if ! output=$(pip install -r requirements-dev.txt 2>&1); then
            echo "$output"
            echo "::error title=Dependency install failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output" | tail -n 5
      - name: Ruff check
        run: |
          if ! output=$(ruff check . 2>&1); then
            echo "$output"
            echo "::error title=Ruff failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output"
      - name: Black check
        run: |
          if ! output=$(black --check . 2>&1); then
            echo "$output"
            echo "::error title=Black failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output"
      - name: Prepare and apply migrations against PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://designora:designora@localhost:5432/designora"
        run: |
          if ! output=$(python -m scripts.prepare_migrations 2>&1 && alembic upgrade heads 2>&1); then
            echo "$output"
            echo "::error title=Migration failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output"
      - name: Create isolated test database
        id: testdb
        run: |
          # dropdb/createdb — har biri alohida ulanish. `psql -c "CREATE
          # DATABASE ..."` ba'zi versiyalarda implicit tranzaksiyaga tushib
          # "cannot run inside a transaction block" beradi.
          if ! output=$( (dropdb --if-exists designora_test && createdb designora_test) 2>&1 ); then
            echo "$output"
            echo "::error title=Test database setup failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "designora_test tayyor"
      - name: Pytest (SQLite — tez qayta aloqa)
        if: ${{ !cancelled() && steps.testdb.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          if ! output=$(pytest --tb=short 2>&1); then
            echo "$output"
            echo "::error title=Pytest (SQLite) failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output" | tail -n 20
      - name: Pytest (PostgreSQL — prod dialekti)
        if: ${{ !cancelled() && steps.testdb.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: "postgresql+psycopg2://designora:designora@localhost:5432/designora_test"
        run: |
          if ! output=$(pytest --tb=short 2>&1); then
            echo "$output"
            echo "::error title=Pytest (PostgreSQL) failure::$(printf '%s' "$output" | tr '\n' ' ' | tail -c 3000)"
            exit 1
          fi
          echo "$output" | tail -n 20
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run coverage
      - run: npm run build
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with retry
        run: |
          for attempt in 1 2 3; do
            docker build -t designora-backend ./backend && exit 0
            echo "Backend Docker pull/build failed, retrying in 15s (attempt ${attempt}/3)"
            sleep 15
          done
          exit 1
      - name: Build frontend image with retry
        run: |
          for attempt in 1 2 3; do
            docker build -t designora-frontend ./frontend && exit 0
            echo "Frontend Docker pull/build failed, retrying in 15s (attempt ${attempt}/3)"
            sleep 15
          done
          exit 1
