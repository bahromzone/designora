name: Browser E2E
run-name: Browser E2E (${{ github.event_name }})

# MUHIM: bu yerda `pull_request.branches: [main]` filtri BO'LMASLIGI kerak.
# Filtr bo'lganda main'ga qaratilmagan PR'larda workflow umuman ishga
# tushmaydi va PR yolg'ondan "Ready to merge" ko'rinadi.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-journey:
    name: Critical student journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/e2e/package.json

      - name: Create deterministic E2E environment
        working-directory: .
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg2://designora:designora@db:5432/designora
          SECRET_KEY=e2e-secret-key
          ENVIRONMENT=development
          SESSION_SECRET_KEY=e2e-session-secret
          JWT_SECRET_KEY=e2e-jwt-secret
          JWT_EXPIRE_MINUTES=60
          MAIL_USERNAME=e2e@example.com
          MAIL_PASSWORD=e2e-password
          MAIL_FROM=e2e@example.com
          MAIL_PORT=587
          MAIL_SERVER=smtp.example.com
          RECAPTCHA_SECRET_KEY=e2e-recaptcha
          ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          FRONTEND_URL=http://localhost:5173
          REDIS_URL=redis://redis:6379/0
          RATE_LIMIT_STORAGE_URI=redis://redis:6379/0
          EOF
          docker compose down -v --remove-orphans

      - name: Build and start local E2E stack
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for the local API
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1

      - name: Wait for the local frontend
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color frontend
          exit 1

      - name: Seed deterministic user and courses
        working-directory: .
        run: |
          seed_output="$(docker compose exec -T backend python -m scripts.seed_e2e)"
          for key in E2E_EMAIL E2E_PASSWORD E2E_COURSE_ID E2E_PAID_COURSE_ID; do
            value="$(printf '%s\n' "$seed_output" | awk -F= -v key="$key" '$1 == key {print substr($0, index($0, "=") + 1)}')"
            test -n "$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          echo "Deterministic E2E fixtures are ready."
          echo "E2E_BASE_URL=http://localhost:5173" >> "$GITHUB_ENV"
          echo "E2E_API_URL=http://localhost:8000" >> "$GITHUB_ENV"

      - name: Install E2E dependencies
        run: npm install --no-fund --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical journey
        id: browser-e2e
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Dump local stack logs on failure
        if: ${{ failure() }}
        working-directory: .
        run: docker compose logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment diagnostics on pull request
        if: ${{ failure() && github.event_name == 'pull_request' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- designora-browser-e2e-diagnostics -->"
          {
            printf '%s\n\n' "$marker"
            printf '### Browser E2E diagnostics\n\n'
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'The browser journey failed. Sensitive cookie values are intentionally omitted.\n\n'
            printf '#### Playwright output\n\n```text\n'
            tail -c 20000 "$RUNNER_TEMP/e2e.log" 2>/dev/null || printf 'No Playwright log captured.\n'
            printf '\n```\n\n#### Compose logs\n\n```text\n'
            tail -c 12000 "$RUNNER_TEMP/compose.log" 2>/dev/null || printf 'No compose log captured.\n'
            printf '\n```\n'
          } > "$RUNNER_TEMP/e2e-comment.md"
          payload="$(jq -Rs '{body: .}' < "$RUNNER_TEMP/e2e-comment.md")"
          comments_url="https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          existing_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$comments_url" | \
            jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .id' | tail -n 1)"
          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            curl --fail --silent --show-error -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPOSITORY/issues/comments/$existing_id" \
              -d "$payload" >/dev/null
          else
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$comments_url" \
              -d "$payload" >/dev/null
          fi

      - name: Tear down local E2E stack
        if: ${{ always() }}
        working-directory: .
        run: docker compose down -v --remove-orphans
