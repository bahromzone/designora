name: Browser E2E

on:
  workflow_dispatch:

jobs:
  critical-journey:
    name: Critical student journey
    if: ${{ secrets.E2E_BASE_URL != '' && secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' && secrets.E2E_COURSE_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/e2e/package.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
          E2E_PAID_COURSE_ID: ${{ secrets.E2E_PAID_COURSE_ID }}
