name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-journey:
    name: Critical student journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/e2e/package.json
      - name: Validate E2E configuration
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          test -n "$E2E_COURSE_ID"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
      - name: Install E2E dependencies
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical journey
        run: npm test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COURSE_ID: ${{ secrets.E2E_COURSE_ID }}
          E2E_PAID_COURSE_ID: ${{ secrets.E2E_PAID_COURSE_ID }}
