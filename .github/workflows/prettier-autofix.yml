name: Frontend diagnostics

on:
  push:
    branches:
      - fix/ci-1167-fastapi-prettier

permissions:
  contents: write

jobs:
  diagnostics:
    name: Capture frontend lint diagnostics
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-1167-fastapi-prettier
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capture pinned ESLint output
        working-directory: frontend
        run: |
          npm ci
          npm run lint > ../frontend-lint-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-lint-diagnostics.txt
          git commit -m "chore(ci): capture lint diagnostics"
          git push origin HEAD:fix/ci-1167-fastapi-prettier
