name: Regenerate React 19 lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/react-19.2.8

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m "fix(frontend): regenerate lockfile for React 19"
          git push
